<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser chrome preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f3f3f3;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #aaa;outline-offset:2px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.browser{margin:32px auto;width:min(1230px,calc(100% - 32px));border:1px solid #4c4c4c;border-radius:17px;background:#181818;min-height:780px;position:relative}
.tabs{height:55px;background:#303132;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:4px;padding:5px 12px}
.tab-wrap{position:relative;min-width:0}.tab{width:308px;height:42px;border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 12px;text-align:left;color:#999}.tab.active{background:#3c3c3c;border:1px solid #505050;color:#eee}.tab .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.youtube{display:grid;place-items:center;width:21px;height:14px;background:#ff0033;border-radius:4px;color:white;font-size:10px;flex-shrink:0}.close{color:#999;font-size:20px}.add,.utility{display:grid;place-items:center;width:36px;height:36px;border-radius:12px}.add{font-size:26px;font-weight:200}.spacer{flex:1}.utility:last-child{background:#3d3e3f}
.nav{height:64px;display:grid;grid-template-columns:minmax(282px,1fr) minmax(0,640px) minmax(282px,1fr);gap:0;align-items:center;padding:8px 10px;border-bottom:1px solid #303030}
.left,.right{display:flex;align-items:center;gap:8px}.right{justify-content:flex-end}.history{height:44px;border-radius:99px;background:#2c2c2c;display:flex;align-items:center;padding:0 5px}.history button{height:30px;width:38px;display:grid;place-items:center}.history button:last-child{border-left:1px solid #414141}.history button:disabled{color:#575757;cursor:default}.pill{height:44px;border-radius:99px;background:#2c2c2c;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}.round{width:44px;padding:0}.pill:hover,.history button:not(:disabled):hover{background:#383838}.pill[aria-pressed=true]{background:#494949;box-shadow:inset 0 0 0 1px #777}
.omnibox{width:100%;height:44px;border:1px solid transparent;border-radius:99px;background:#2c2c2c;text-align:center;padding:0 20px;min-width:0;outline:none!important}.omnibox:focus{background:#353535;border-color:#777;text-align:left}
.hovercard{position:absolute;top:44px;left:0;width:418px;padding:18px 12px 22px;border:1px solid #383838;border-radius:18px;background:#2c2c2c;box-shadow:0 14px 30px #0004;z-index:10;visibility:hidden;opacity:0;transition:opacity .12s,visibility .12s;pointer-events:none}.tab-wrap:hover .hovercard,.tab-wrap:focus-within .hovercard{visibility:visible;opacity:1;transition-delay:.4s}.hovercard p{margin:0 0 8px;font-size:16px;line-height:22px}.hovercard .host{color:#999;margin-bottom:16px}.snapshot{display:block;width:100%;height:auto;stroke:none}.page{overflow:hidden;border-radius:0 0 16px 16px}.page>.snapshot{width:100%;height:auto}.newtab{display:none;padding:220px 24px;max-width:800px;margin:auto}.newtab input{height:64px;width:100%;background:#3b3b3b;border:0;border-radius:99px;padding:0 28px}.newtab p{color:#aaa;margin-top:48px}.tiles{display:flex;gap:10px}.tiles button{flex:1;text-align:left;padding:28px 24px;border-radius:22px;background:#242424;height:115px}
.menu{position:absolute;right:12px;top:116px;z-index:20;background:#2c2c2c;border:1px solid #484848;border-radius:14px;padding:8px;box-shadow:0 8px 24px #0006}.menu button{display:block;padding:10px 16px;text-align:left;width:100%;border-radius:8px}.menu button:hover{background:#444}.note{max-width:1230px;margin:16px auto;color:#999;font-size:13px;padding:0 16px}
@media(max-width:1100px){.nav{grid-template-columns:282px minmax(80px,1fr) 104px;gap:8px}.tab{width:250px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<svg style="display:none"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14"/></symbol>
<symbol id="forward" viewBox="0 0 24 24"><path d="m10 5 7 7-7 7M3 12h14"/></symbol>
<symbol id="reload" viewBox="0 0 24 24"><path d="M20 7a8 8 0 0 0-13-2L4 8m0-5v5h5M4 17a8 8 0 0 0 13 2l3-3m0 5v-5h-5"/></symbol>
<symbol id="annotate" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M11 10l3 11 2-5 5-2-10-4Z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M6 4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-3l-4 3v-3H6a3 3 0 0 1-3-3v-2l2-2-2-2V7a3 3 0 0 1 3-3Z"/></symbol>
<symbol id="panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M15 4v16"/></symbol>
</defs></svg>
<main class="browser">
<header class="tabs">
<div class="tab-wrap"><button class="tab active" id="video-tab"><span class="youtube">▶</span><span class="name">Warmwind takes your lead generation</span><span class="close">×</span></button>
<div class="hovercard" role="tooltip"><p>Warmwind takes your lead generation - YouTube</p><p class="host">youtube.com</p><svg class="snapshot" viewBox="972 158 1224 760"><image href="reference.png" width="2256" height="1532"/></svg></div></div>
<button class="tab" id="new-tab" hidden style="display:none"><span>◎</span><span class="name">New tab</span><span class="close">×</span></button>
<button class="add" aria-label="New tab">+</button><div class="spacer"></div><button class="utility" aria-label="Expand preview">⛶</button><button class="utility" aria-label="Toggle side panel"><svg><use href="#panel"/></svg></button>
</header>
<nav class="nav" aria-label="Browser navigation"><div class="left"><div class="history"><button disabled aria-label="Back"><svg><use href="#back"/></svg></button><button disabled aria-label="Forward"><svg><use href="#forward"/></svg></button><button aria-label="Reload"><svg><use href="#reload"/></svg></button></div><button class="pill annotate" aria-pressed="false"><svg><use href="#annotate"/></svg>Annotate</button></div>
<input class="omnibox" aria-label="Address and search" value="youtube.com" spellcheck="false">
<div class="right"><button class="pill round" aria-label="Side chat"><svg><use href="#chat"/></svg></button><button class="pill round more" aria-label="Browser menu">···</button></div></nav>
<div class="menu" hidden><button>Copy URL</button><button>Zoom: 100%</button><button>Find in page</button></div>
<section class="page"><svg class="snapshot" viewBox="972 158 1224 1296"><image href="reference.png" width="2256" height="1532"/></svg></section>
<section class="newtab"><input aria-label="Search files or enter a URL" placeholder="⌕  Search files or enter a URL"><p>New</p><div class="tiles"><button>▣<br><br>Terminal</button><button>♧<br><br>Changes</button><button>▢<br><br>Files</button><button>⊕<br><br>Side chat</button></div></section>
</main>
<p class="note">HTML preview · Hover the YouTube tab to see its preview. Click + for the new-tab layout. Page content is a static crop of your reference screenshot.</p>
<script>
const $=s=>document.querySelector(s),address=$('.omnibox');
let url='https://youtube.com/watch?v=preview';
address.addEventListener('focus',()=>{address.value=url;address.select()});
address.addEventListener('blur',()=>{try{address.value=new URL(url).host}catch{address.value=url}});
address.addEventListener('keydown',e=>{if(e.key==='Enter'){url=address.value.includes('://')?address.value:'https://'+address.value;address.blur()}if(e.key==='Escape')address.blur()});
$('.annotate').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
$('.more').onclick=()=>$('.menu').hidden=!$('.menu').hidden;
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('.menu').hidden=true});
function showNew(f){$('.page').style.display=f?'none':'block';$('.newtab').style.display=f?'block':'none';$('.nav').style.display=f?'none':'grid';$('#new-tab').style.display='flex';$('#new-tab').classList.toggle('active',f);$('#video-tab').classList.toggle('active',!f)}
$('.add').onclick=()=>showNew(true);$('#new-tab').onclick=()=>showNew(true);$('#video-tab').onclick=()=>showNew(false);
</script>
</html>
