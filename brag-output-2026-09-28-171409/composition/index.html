<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KronTerm — Brag</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "SFMono-Regular";
        src: local("SFMono-Regular"), local("Menlo");
      }
      @font-face {
        font-family: "Consolas";
        src: local("Consolas"), local("Menlo");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050608;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #050608;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #f5f7fb;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ── persistent background ─────────────────────────── */
      #bg {
        z-index: 0;
      }
      #glow {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 1400px;
        height: 900px;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(184, 255, 108, 0.1), transparent 70%);
        opacity: 0.3;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(5, 6, 8, 0.85) 100%);
        opacity: 0.55;
      }

      /* ── scene 1+2: canvas ─────────────────────────────── */
      #canvas-stage,
      #canvas-overlay {
        z-index: 1;
      }
      #canvas-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5, 6, 8, 0.55) 0%, rgba(5, 6, 8, 0.1) 40%, rgba(5, 6, 8, 0.72) 100%);
      }
      #topline {
        position: absolute;
        top: 64px;
        left: 96px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #a6adba;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #b8ff6c;
        box-shadow: 0 0 12px rgba(184, 255, 108, 0.8);
        display: inline-block;
      }
      #hero {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 150px;
      }
      #hero h1 {
        font-size: 108px;
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: -0.035em;
        text-shadow: 0 4px 40px rgba(5, 6, 8, 0.9);
      }
      #hero .wg {
        display: inline-block;
        opacity: 0;
      }
      #hero em {
        font-style: normal;
        color: #b8ff6c;
      }
      #chips {
        position: absolute;
        top: 150px;
        right: 96px;
        display: flex;
        gap: 18px;
      }
      .chip {
        display: inline-block;
        padding: 14px 30px;
        border-radius: 999px;
        background: rgba(9, 11, 16, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 28px;
        font-weight: 600;
        color: #f5f7fb;
        opacity: 0;
      }

      /* ── scene 3: agent ────────────────────────────────── */
      #agent-stage,
      #agent-overlay {
        z-index: 1;
      }
      #agent-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5, 6, 8, 0.5) 0%, rgba(5, 6, 8, 0.05) 45%, rgba(5, 6, 8, 0.6) 100%);
      }
      #agent-chip {
        position: absolute;
        top: 96px;
        left: 96px;
        padding: 28px 40px;
        border-radius: 20px;
        background: rgba(9, 11, 16, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        opacity: 0;
      }
      #agent-chip .chip-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      #agent-chip .chip-line {
        margin-top: 12px;
        font-family: "SFMono-Regular", ui-monospace, Consolas, monospace;
        font-size: 26px;
        color: #a6adba;
        min-height: 34px;
      }
      #agent-chip .chip-line .cursor {
        display: inline-block;
        width: 3px;
        height: 26px;
        background: #b8ff6c;
        vertical-align: -3px;
        margin-left: 2px;
      }

      /* ── scene 4: two surfaces ─────────────────────────── */
      #split-l,
      #split-r {
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      #split-l {
        left: 0;
      }
      #split-r {
        left: 50%;
      }
      #split-overlay {
        z-index: 1;
      }
      #split-l video,
      #split-r video {
        filter: saturate(1.05);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 55%, rgba(5, 6, 8, 0.88) 100%);
      }
      #scrim-l {
        left: 0;
        width: 50%;
      }
      #scrim-r {
        left: 50%;
      }
      .half-label {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 72px;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        opacity: 0;
      }
      #line-l {
        left: 64px;
        right: calc(50% + 64px);
      }
      #line-r {
        left: calc(50% + 64px);
        right: 64px;
      }
      #line-l em {
        font-style: normal;
        color: #74d7ff;
      }
      #line-r em {
        font-style: normal;
        color: #b8ff6c;
      }
      #seam {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(255, 255, 255, 0.18);
        z-index: 2;
      }

      /* ── scene 5: outro ────────────────────────────────── */
      #scene-outro {
        z-index: 2;
        background: #050608;
      }
      #outro-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1600px;
        height: 1000px;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(184, 255, 108, 0.08), transparent 70%);
      }
      #punch {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 300px;
        text-align: center;
        font-size: 96px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.035em;
        opacity: 0;
      }
      #punch em {
        font-style: normal;
        color: #b8ff6c;
      }
      #logo {
        position: absolute;
        left: 50%;
        top: 640px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 22px;
        opacity: 0;
      }
      #logo img {
        width: 72px;
        height: 72px;
      }
      #logo span {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      #url {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        font-size: 30px;
        font-weight: 600;
        color: #a6adba;
        letter-spacing: 0.04em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- persistent background: audio-reactive glow + vignette -->
      <div id="bg" class="clip" data-start="0" data-duration="20">
        <div id="glow"></div>
        <div id="vignette"></div>
      </div>

      <!-- Scene 1+2 — hook + canvas (0-8s) -->
      <video
        id="vid-canvas"
        class="clip"
        muted
        src="assets/video/canvas-widgets.mp4"
        data-start="0"
        data-duration="8"
        data-media-start="0"
        data-volume="0"
      ></video>
      <div id="canvas-stage" class="clip" data-start="0" data-duration="8">
        <div id="canvas-shade"></div>
      </div>
      <div id="canvas-overlay" class="clip" data-start="0" data-duration="8">
        <div id="topline" class="clip" data-start="0.3" data-duration="4.5">
          <span class="dot"></span>Private beta · open canvas notebook
        </div>
        <div id="hero">
          <h1>
            <span class="wg" id="wg1">The living canvas</span>
            <span class="wg" id="wg2">for <em>human + agent</em></span>
            <span class="wg" id="wg3">work.</span>
          </h1>
        </div>
        <div id="chips">
          <span class="chip" id="chip1">Terminal</span>
          <span class="chip" id="chip2">Browser</span>
          <span class="chip" id="chip3">Editor</span>
          <span class="chip" id="chip4">Agent</span>
        </div>
      </div>

      <!-- Scene 3 — the agent (8-12.5s) -->
      <video
        id="vid-agent"
        class="clip"
        muted
        src="assets/video/agent-chat.mp4"
        data-start="8"
        data-duration="4.5"
        data-media-start="0"
        data-volume="0"
      ></video>
      <div id="agent-stage" class="clip" data-start="8" data-duration="4.5">
        <div id="agent-shade"></div>
      </div>
      <div id="agent-overlay" class="clip" data-start="8" data-duration="4.5">
        <div id="agent-chip">
          <div class="chip-title"><span class="dot"></span>KronosCode is working</div>
          <div class="chip-line"><span id="typed-line"></span><span class="cursor" id="type-cursor"></span></div>
        </div>
      </div>

      <!-- Scene 4 — two surfaces (12.5-16.5s) -->
      <div id="split-l">
        <video
          id="vid-browser"
          muted
          src="assets/video/browser-focus.mp4"
          data-start="12.5"
          data-duration="4"
          data-media-start="2"
          data-volume="0"
        ></video>
      </div>
      <div id="split-r">
        <video
          id="vid-terminal"
          muted
          src="assets/video/terminal.mp4"
          data-start="12.5"
          data-duration="4"
          data-media-start="1"
          data-volume="0"
        ></video>
      </div>
      <div id="split-overlay" class="clip" data-start="12.5" data-duration="4">
        <div class="scrim" id="scrim-l"></div>
        <div class="scrim" id="scrim-r"></div>
        <div class="half-label" id="line-l">Change the code. <em>See it answer.</em></div>
        <div class="half-label" id="line-r">Every edit stays <em>reviewable.</em></div>
        <div id="seam"></div>
      </div>

      <!-- Scene 5 — outro (16.5-20s) -->
      <div id="scene-outro" class="clip" data-start="16.5" data-duration="3.5">
        <div id="outro-glow"></div>
        <div id="punch">
          Stop feeding AI a transcript.<br />
          Give it the <em>workspace</em>.
        </div>
        <div id="logo">
          <img src="assets/kronterm-icon.svg" alt="" />
          <span>KronTerm</span>
        </div>
        <div id="url">kronterm.io</div>
      </div>

      <!-- ── audio ─────────────────────────────────────────── -->
      <audio
        id="bg-music"
        data-start="0.3"
        data-duration="19.7"
        data-track-index="10"
        data-volume="0.28"
        data-fade-in="0.3"
        data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>

      <!-- scene 1: hero word-group key ticks -->
      <audio id="sfx-wg1" data-start="0.9" data-duration="0.5" data-track-index="11" data-volume="0.5" src="assets/sfx/keyboard/keypress-009.wav"></audio>
      <audio id="sfx-wg2" data-start="1.3" data-duration="0.5" data-track-index="12" data-volume="0.5" src="assets/sfx/keyboard/keypress-012.wav"></audio>
      <audio id="sfx-wg3" data-start="1.64" data-duration="0.5" data-track-index="13" data-volume="0.55" src="assets/sfx/keyboard/keypress-015.wav"></audio>

      <!-- scene 2: chip snaps (beat-grid) -->
      <audio id="sfx-chip1" data-start="4.91" data-duration="0.6" data-track-index="14" data-volume="0.6" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-chip2" data-start="5.34" data-duration="0.6" data-track-index="15" data-volume="0.55" src="assets/sfx/interface/drop_002.ogg"></audio>
      <audio id="sfx-chip3" data-start="6" data-duration="0.6" data-track-index="16" data-volume="0.55" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-chip4" data-start="6.56" data-duration="0.6" data-track-index="17" data-volume="0.6" src="assets/sfx/interface/drop_003.ogg"></audio>

      <!-- scene 3: typing ticks (every 4th char) -->
      <audio id="sfx-type1" data-start="9.2" data-duration="0.4" data-track-index="18" data-volume="0.4" src="assets/sfx/keyboard/keypress-001.wav"></audio>
      <audio id="sfx-type2" data-start="9.38" data-duration="0.4" data-track-index="19" data-volume="0.4" src="assets/sfx/keyboard/keypress-004.wav"></audio>
      <audio id="sfx-type3" data-start="9.56" data-duration="0.4" data-track-index="20" data-volume="0.4" src="assets/sfx/keyboard/keypress-008.wav"></audio>
      <audio id="sfx-type4" data-start="9.74" data-duration="0.4" data-track-index="21" data-volume="0.4" src="assets/sfx/keyboard/keypress-011.wav"></audio>
      <audio id="sfx-type5" data-start="9.92" data-duration="0.4" data-track-index="22" data-volume="0.4" src="assets/sfx/keyboard/keypress-018.wav"></audio>
      <audio id="sfx-type6" data-start="10.1" data-duration="0.4" data-track-index="23" data-volume="0.4" src="assets/sfx/keyboard/keypress-022.wav"></audio>
      <audio id="sfx-type6b" data-start="10.28" data-duration="0.4" data-track-index="24" data-volume="0.4" src="assets/sfx/keyboard/keypress-025.wav"></audio>
      <audio id="sfx-type6c" data-start="10.46" data-duration="0.4" data-track-index="25" data-volume="0.4" src="assets/sfx/keyboard/keypress-029.wav"></audio>

      <!-- scene 4: line landings -->
      <audio id="sfx-line-l" data-start="13.11" data-duration="0.6" data-track-index="26" data-volume="0.55" src="assets/sfx/interface/click_001.ogg"></audio>
      <audio id="sfx-line-r" data-start="13.9" data-duration="0.6" data-track-index="27" data-volume="0.55" src="assets/sfx/interface/drop_002.ogg"></audio>

      <!-- scene 5: outro line + logo -->
      <audio id="sfx-punch" data-start="17.47" data-duration="1.2" data-track-index="28" data-volume="0.6" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-logo" data-start="18.6" data-duration="1.2" data-track-index="29" data-volume="0.3" src="assets/sfx/interface/bong_001.ogg"></audio>
    </div>

    <script src="audio-data.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      /* ── persistent background: audio-reactive breathing ── */
      const glowEl = document.getElementById("glow");
      const vignetteEl = document.getElementById("vignette");
      const FRAMES = Math.min(600, window.AUDIO_DATA.totalFrames);
      for (let f = 0; f < FRAMES; f++) {
        tl.call(
          (function (frame) {
            return function () {
              const rms = frame.rms != null ? frame.rms : 0.3;
              const bass = frame.bands[0] != null ? frame.bands[0] : 0.1;
              glowEl.style.opacity = (0.22 + rms * 0.35).toFixed(3);
              glowEl.style.transform = "translate(-50%, -50%) scale(" + (1 + bass * 0.12).toFixed(3) + ")";
              vignetteEl.style.opacity = (0.5 + rms * 0.18).toFixed(3);
            };
          })(window.AUDIO_DATA.frames[f]),
          [],
          f / window.AUDIO_DATA.fps
        );
      }

      /* ── scene 1+2: canvas recording (0-8s) ── */
      tl.fromTo("#vid-canvas", { scale: 1.04 }, { scale: 1.12, duration: 8, ease: "none" }, 0);
      tl.fromTo("#topline", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);

      // hero word groups — full line lands on the beat grid
      tl.fromTo("#wg1", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.9);
      tl.fromTo("#wg2", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.3);
      // beat-locked: 1.64s (beat grid)
      tl.fromTo("#wg3", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.64);
      // hold, then hand off to the chip phase
      tl.to("#hero", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 4.4);
      tl.to("#topline", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.4);

      // scene 2: widget chips snap in on the beat grid, hold as a set
      // beat-grid: chip1 4.91s, chip2 5.34s, chip3 6.00s, chip4 6.56s
      tl.fromTo("#chip1", { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 4.91);
      tl.fromTo("#chip2", { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 5.34);
      tl.fromTo("#chip3", { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.0);
      tl.fromTo("#chip4", { opacity: 0, scale: 0.6, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.56);
      tl.to("#chips", { opacity: 0, duration: 0.35, ease: "power2.in" }, 7.6);

      /* ── scene 3: the agent (8-12.5s) ── */
      tl.fromTo("#vid-agent", { scale: 1.08 }, { scale: 1.0, duration: 4.5, ease: "power1.out" }, 8);
      // beat-locked: 8.74s (strong cue)
      tl.fromTo("#agent-chip", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.74);

      // typed activity line: character-by-character, deterministic
      const TYPED = "Reading terminal output + 4 files";
      const typedEl = document.getElementById("typed-line");
      const CHAR_START = 9.2;
      const CHAR_STEP = 0.045;
      for (let i = 0; i < TYPED.length; i++) {
        tl.call(
          (function (n) {
            return function () {
              typedEl.textContent = TYPED.slice(0, n + 1);
            };
          })(i),
          [],
          CHAR_START + i * CHAR_STEP
        );
      }
      tl.to("#agent-chip", { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" }, 12.1);

      /* ── scene 4: two surfaces (12.5-16.5s) ── */
      tl.fromTo("#split-l", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 12.5);
      tl.fromTo("#split-r", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 12.5);
      tl.fromTo("#seam", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" }, 12.5);
      // beat-locked: 13.11s (strong cue)
      tl.fromTo("#line-l", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 13.11);
      tl.fromTo("#line-r", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 13.9);
      tl.to("#split-l", { opacity: 0, duration: 0.35, ease: "power2.in" }, 16.1);
      tl.to("#split-r", { opacity: 0, duration: 0.35, ease: "power2.in" }, 16.1);
      tl.to("#split-overlay", { opacity: 0, duration: 0.35, ease: "power2.in" }, 16.1);

      /* ── scene 5: outro (16.5-20s) ── */
      // beat-locked: 17.47s (strong cue)
      tl.fromTo("#punch", { opacity: 0, y: 34, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 17.47);
      tl.fromTo("#logo", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 18.6);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 18.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
