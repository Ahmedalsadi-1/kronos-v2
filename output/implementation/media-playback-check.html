<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>KronTerm media playback check</title>
<style>
body { margin: 48px; background: #141519; color: #f4f5f7; font: 16px -apple-system, sans-serif; }
button { padding: 12px 20px; border: 1px solid #737985; border-radius: 12px; background: #30323a; color: inherit; cursor: pointer; }
audio { display: block; margin-top: 24px; }
</style>
<h1>Media playback check</h1>
<p>This local, silent audio fixture checks the desktop and notch playback controls.</p>
<button id="start">Start silent playback</button>
<audio id="audio" controls loop></audio>
<script>
const audio = document.getElementById('audio');
document.getElementById('start').onclick = async () => {
    if (!audio.src) {
        const bytes = new Uint8Array(44 + 32000);
        const view = new DataView(bytes.buffer);
        const text = (offset, value) => [...value].forEach((char, i) => bytes[offset + i] = char.charCodeAt(0));
        text(0, 'RIFF'); view.setUint32(4, bytes.length - 8, true); text(8, 'WAVE'); text(12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, 8000, true); view.setUint32(28, 16000, true); view.setUint16(32, 2, true);
        view.setUint16(34, 16, true); text(36, 'data'); view.setUint32(40, bytes.length - 44, true);
        audio.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'Media playback check', artist: 'Silent local fixture' });
    }
    await audio.play();
};
</script>
</html>
