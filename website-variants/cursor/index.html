<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9fe" />
    <script>
      try {
        const savedTheme = localStorage.getItem("kronos-theme");
        const dark =
          savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#161616" : "#faf9fe";
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/kronos-logo.svg" />
    <title>KronOS | A workspace for you and your agents</title>
    <meta
      name="description"
      content="KronOS brings terminals, browsers, files, and AI agents into one persistent desktop workspace."
    />
    <meta property="og:title" content="KronOS | A workspace for you and your agents" />
    <meta
      property="og:description"
      content="A living command center for coding, browsing, testing, automation, and workspace-aware agent execution."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
