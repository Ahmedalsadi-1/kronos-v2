<!doctype html><html lang="en"><meta charset="utf-8"><title>KronTerm cursor feedback</title>
<style>
body{margin:0;padding:40px;background:#f5f4f0;color:#292a2e;font:16px system-ui}h1{font-size:28px}p{max-width:700px;line-height:1.5}#stages{display:flex;gap:18px;flex-wrap:wrap}section{background:white;border:1px solid #d8d7d3;border-radius:12px}h2{font-size:14px;margin:20px}canvas{display:block}#live{position:relative;margin-top:24px;max-width:1116px;height:240px;background:white;border:1px solid #d8d7d3;border-radius:12px;overflow:hidden}#live button{position:absolute;top:120px;left:45%;background:#1e3452;color:white;padding:10px 24px;border:0;border-radius:7px;cursor:pointer}#live p{margin:20px}#run{position:static;margin:12px 0;padding:10px 18px;border:0;border-radius:8px;background:#313131;color:white;cursor:pointer}</style>
<h1>KronTerm cursor feedback</h1><p>Agent-owned cursor: continuous spring motion, soft neutral fog, a short press, and a compact action label.</p><button id="run">Run agent sequence</button><div id="stages"></div><div id="live"><p>Move your mouse anywhere: the agent cursor follows only the scripted agent actions.</p><button>Save</button></div><script src="preview.js"></script></html>
