<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Split Decision — KronOS</title><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Inter;src:url(assets/inter.woff2);font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#151515;font-family:Inter,Arial,sans-serif}#film{position:relative;width:1920px;height:1080px;overflow:hidden;background:#151515;color:#fff6e7}
.layer,.cover{position:absolute;inset:0;overflow:hidden}.half{position:absolute;top:0;width:960px;height:1080px;overflow:hidden}.left{left:0;background:#e84231;color:#141414}.right{left:960px;background:#151515;color:#fff6e7}.word{position:absolute;top:268px;left:0;width:1920px;text-align:center;font-weight:900;font-size:395px;letter-spacing:-34px;line-height:1.08}.right .word{left:-960px}.cap{position:absolute;top:60px;font-size:32px;font-weight:600;letter-spacing:-1.2px}.left .cap{left:68px}.right .cap{right:68px}.slash{position:absolute;top:760px;height:7px;width:131px;background:currentColor}.left .slash{right:0}.right .slash{left:0}
#first{background:#151515}.clipbox{position:absolute;overflow:hidden;background:#252528}.clipbox video{width:100%;height:100%;object-fit:cover;display:block}
#box1{left:555px;top:130px;width:1298px;height:810px;border:1px solid #77736c}
#firstRail{position:absolute;top:0;left:0;bottom:0;width:520px;background:#e84231;color:#121212}
.head{position:absolute;font-size:86px;font-weight:800;line-height:.94;letter-spacing:-6px;margin:0}.firstHead{top:380px;left:49px}.kicker{position:absolute;top:71px;left:50px;font-size:28px;font-weight:650;letter-spacing:-1px}.legend{position:absolute;bottom:48px;left:560px;font-size:26px;letter-spacing:-.8px}
#second{background:#fff6e7;color:#151515}#box2{left:45px;top:104px;width:1240px;height:836px;border:1px solid #151515}.secondHead{left:1355px;top:360px;font-size:94px}.divider{position:absolute;top:105px;left:1317px;width:5px;height:835px;background:#e84231}#second .kicker{top:45px;left:47px}
#dual{background:#151515}#dualTitle{position:absolute;left:55px;top:26px;font-size:67px;font-weight:800;letter-spacing:-4px}#box3{top:128px;left:46px;width:1828px;height:910px;border:1px solid #666}#box3 video{object-fit:fill}
#out{background:#0b0c11}#out img{width:100%;height:100%}#sweep{position:absolute;inset:0;background:#e84231}
#first,#second,#dual,#out,#sweep{opacity:0}</style></head><body><main id="film" data-composition-id="split-decision" data-width="1920" data-height="1080" data-duration="18" data-fps="30">
<section id="first" class="layer"><div id="box1" class="clipbox"><video id="video-first" class="clip" src="assets/first.mp4" data-start="2.32" data-duration="4.73" data-track-index="1" muted playsinline></video></div><div id="firstRail" data-layout-allow-overlap data-layout-allow-occlusion><div class="kicker">Tab preview</div><p class="head firstHead">Before<br>you<br>open it.</p></div></section>
<section id="second" class="layer"><div class="kicker">Tab preview</div><div id="box2" class="clipbox"><video id="video-next" class="clip" src="assets/next.mp4" data-start="6.62" data-duration="3.69" data-track-index="2" muted playsinline></video></div><div class="divider"></div><p class="head secondHead">Take<br>a look.</p></section>
<section id="dual" class="layer"><div id="dualTitle">Keep both open.</div><div id="box3" class="clipbox"><video id="video-both" class="clip" src="assets/both.mp4" data-start="9.86" data-duration="5.60" data-track-index="3" muted playsinline></video></div></section>
<div id="intro" class="cover"><div data-layout-allow-overflow class="half left"><span class="cap">KronOS</span><div class="word" data-layout-allow-overflow data-layout-allow-occlusion>SPLIT</div><span class="slash"></span></div><div data-layout-allow-overflow class="half right"><span class="cap">Decision</span><div class="word" data-layout-allow-overflow data-layout-allow-occlusion>SPLIT</div><span class="slash"></span></div></div>
<div id="out" class="cover"><img src="assets/wordmark.jpg" alt="KronOS"></div><div id="sweep"></div>
<audio id="score" class="clip" data-start="0" data-duration="18" data-track-index="4" src="assets/score.m4a"></audio>
</main><script>
const timeline=gsap.timeline({paused:true});
timeline.set('#first',{opacity:1},2.30);timeline.set('#intro',{autoAlpha:0},3.01);timeline.set('#first',{autoAlpha:0},7.03);timeline.set('#second',{autoAlpha:0},10.32);timeline.set('#dual',{autoAlpha:0},15.47);
timeline.fromTo('.slash',{scaleX:0},{scaleX:1,duration:.49,ease:'power2.out'},.2);
timeline.to('.left',{x:-960,duration:.68,ease:'power4.inOut'},2.32);
timeline.to('.right',{x:960,duration:.68,ease:'power4.inOut'},2.32);
timeline.fromTo('#box1',{scale:1.065},{scale:1,duration:1.0,ease:'power3.out'},2.45);
timeline.fromTo('#second',{opacity:1,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0% 0 0)',duration:.40,ease:'power3.inOut'},6.62);
timeline.fromTo('#box2',{x:-65},{x:0,duration:.60,ease:'power3.out'},6.72);
timeline.fromTo('#dual',{opacity:1,clipPath:'inset(0% 48% 0% 48%)'},{opacity:1,clipPath:'inset(0% 0% 0% 0%)',duration:.45,ease:'power3.inOut'},9.86);
timeline.fromTo('#box3',{scale:.96},{scale:1,duration:.8,ease:'power3.out'},9.9);
timeline.fromTo('#sweep',{x:-1920,opacity:1},{x:0,opacity:1,duration:.31,ease:'power3.in'},15.15);
timeline.set('#out',{opacity:1},15.46);
timeline.to('#sweep',{x:1920,duration:.40,ease:'power3.out'},15.46);
timeline.set('#sweep',{opacity:0},16);
window.__timelines={'split-decision':timeline};
</script></body></html>
