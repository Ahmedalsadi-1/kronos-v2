<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click the Dot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            background: #0c101c;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        main { text-align: center; }
        #arena {
            position: relative;
            width: min(80vw, 520px);
            height: 320px;
            margin-top: 16px;
            border: 2px solid #f66d41;
            border-radius: 20px;
            background: #151b2b;
            overflow: hidden;
        }
        #dot {
            position: absolute;
            width: 54px;
            height: 54px;
            border: 0;
            border-radius: 50%;
            background: #f66d41;
            cursor: pointer;
            transition: transform 80ms ease;
        }
        #dot:active { transform: scale(0.85); }
    </style>
</head>
<body>
    <main>
        <h1>Click the Dot</h1>
        <p>Score: <strong id="score">0</strong></p>
        <div id="arena"><button id="dot" aria-label="Score a point"></button></div>
    </main>
    <script>
        const arena = document.querySelector("#arena");
        const dot = document.querySelector("#dot");
        const score = document.querySelector("#score");
        let points = 0;

        function moveDot() {
            const x = Math.random() * (arena.clientWidth - dot.offsetWidth);
            const y = Math.random() * (arena.clientHeight - dot.offsetHeight);
            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;
        }

        dot.addEventListener("click", () => {
            points += 1;
            score.textContent = points;
            moveDot();
        });

        moveDot();
    </script>
</body>
</html>
